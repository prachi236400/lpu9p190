<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        :root {
            --bg-1: #f7f3e9;
            --bg-2: #e7efe9;
            --ink: #1f2937;
            --accent: #0f766e;
            --card: rgba(255, 255, 255, 0.75);
            --border: rgba(15, 118, 110, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Georgia, "Times New Roman", Times, serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 10% 10%, #fff6cf 0%, transparent 60%),
                radial-gradient(1000px 500px at 90% 90%, #d9f1ee 0%, transparent 60%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            padding: 24px;
        }

        .card {
            width: min(680px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 16px 40px rgba(31, 41, 55, 0.12);
            backdrop-filter: blur(6px);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            line-height: 1.1;
        }

        p {
            margin: 0;
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            margin-bottom: 14px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <h1>Home</h1>
<body>
    <main class="card">
        <span class="tag">Starter Page</span>
        <h1>Your index.html is ready.</h1>
        <h2>Welcome to Your Site</h2>
        <p>
            This is a responsive starter template. Replace this content with your app or site layout.
        </p>

    </main>
</body>
